<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sessions</title>
    <meta name="theme-color" content="#0f0f0f" />
    <link rel="icon" href="/assets/sessions-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/ds/src/styles/fonts.css" />
    <link rel="stylesheet" href="/ds/src/styles/globals.css" />
    <link rel="stylesheet" href="/ds/src/styles/navigation.css" />
    <link rel="stylesheet" href="/ds/src/styles/avatar.css" />
    <style>
      html,
      body {
        height: 100%;
        background: var(--black-900);
      }

      .home-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 100%;
        background: var(--black-900);
      }

      .home-shell__mobile {
        display: none;
      }

      .home-shell__body {
        display: flex;
        flex: 1;
        min-height: 0;
        background: var(--black-900);
      }

      .home-shell__rail {
        display: flex;
        flex-shrink: 0;
        height: 100%;
      }

      .home-shell__rail .sessions-left-rail {
        height: 100%;
      }

      .home-shell__main {
        flex: 1;
        min-width: 0;
        background: var(--black-900);
      }

      @media (max-width: 768px) {
        .home-shell__desktop,
        .home-shell__rail {
          display: none;
        }

        .home-shell__mobile {
          display: block;
          position: absolute;
          inset: 0;
          z-index: 2;
          pointer-events: none;
        }

        .home-shell__mobile .mobile-menu-device {
          width: 100%;
          height: 100%;
          background: transparent;
          pointer-events: none;
        }

        .home-shell__mobile .mobile-menu,
        .home-shell__mobile .mobile-menu-panel {
          pointer-events: auto;
        }

        .home-shell__mobile .mobile-menu-device.is-open .mobile-menu__content {
          pointer-events: auto;
        }

        .home-shell__mobile .mobile-menu-panel {
          width: min(334px, calc(100% - 16px));
        }
      }
    </style>
  </head>
  <body>
    <div class="home-shell">
      <div id="top-nav" class="home-shell__desktop"></div>
      <div id="mobile-nav" class="home-shell__mobile"></div>
      <div class="home-shell__body">
        <div class="home-shell__rail" id="rail"></div>
        <main class="home-shell__main"></main>
      </div>
    </div>
    <script type="module">
      import {
        renderMobileMenu,
        renderSessionsLeftRail,
        renderTopNav,
      } from "/ds/src/components/navigation/index.js";

      const navOptions = {
        href: "/",
        ariaLabel: "Sessions home",
      };

      document.querySelector("#top-nav").innerHTML = renderTopNav(navOptions);
      document.querySelector("#rail").innerHTML = renderSessionsLeftRail({
        selected: "home",
      });
      document.querySelector("#mobile-nav").innerHTML = renderMobileMenu(navOptions);

      document.addEventListener("click", (event) => {
        const toggle = event.target.closest("[data-mobile-menu-toggle]");
        if (!toggle) return;

        event.preventDefault();
        const expanded = toggle.getAttribute("aria-expanded") === "true";
        const nextExpanded = !expanded;
        toggle.setAttribute("aria-expanded", String(nextExpanded));
        toggle.setAttribute(
          "aria-label",
          nextExpanded
            ? toggle.dataset.closeLabel || "Close menu"
            : toggle.dataset.menuLabel || "Open menu",
        );

        const device = toggle.closest(".mobile-menu-device");
        device?.classList.toggle("is-open", nextExpanded);
        device
          ?.querySelector("[data-mobile-menu-panel]")
          ?.setAttribute("aria-hidden", String(!nextExpanded));
      });

      const mobileQuery = window.matchMedia("(max-width: 768px)");
      mobileQuery.addEventListener("change", (event) => {
        if (event.matches) return;

        document.querySelectorAll(".mobile-menu-device.is-open").forEach((device) => {
          device.classList.remove("is-open");
          const toggle = device.querySelector("[data-mobile-menu-toggle]");
          if (!toggle) return;
          toggle.setAttribute("aria-expanded", "false");
          toggle.setAttribute("aria-label", toggle.dataset.menuLabel || "Open menu");
          device.querySelector("[data-mobile-menu-panel]")?.setAttribute("aria-hidden", "true");
        });
      });
    </script>
  </body>
</html>
